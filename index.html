<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>基礎專業英語｜期中聽力練習器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f4f0e6;--card:#fffdf8;--card2:#faf6ec;--ink:#1d2331;--muted:#6b6f7a;--line:#e3dccd;
  --accent:#2c56c9;--accent-soft:#e6ecff;--hl:#ffe680;--ok:#1d8656;--ok-soft:#e1f4ea;--bad:#cf3f35;--bad-soft:#fde7e4;
  --warn:#9a5f00;--warn-soft:#fff2d2;--star:#d98b14;--man:#2e66c8;--woman:#c13d78;--narr:#8b8f98;
  --topH:56px;--playerH:66px;--r:14px;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#15171c;--card:#1e2128;--card2:#23272f;--ink:#e9e6df;--muted:#9da2ad;--line:#323640;
  --accent:#86a6ff;--accent-soft:#25304d;--hl:#6a5714;--ok:#53c48e;--ok-soft:#173326;--bad:#ff7d72;--bad-soft:#3d1e1b;
  --warn:#f0b54a;--warn-soft:#3a2f17;--man:#80aaff;--woman:#ff8cbc;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:40;height:var(--topH);display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--card);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0;cursor:pointer}
.brand b{font-size:17px;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.menu-btn{display:none;border:1px solid var(--line);background:var(--card2);border-radius:10px;padding:6px 10px;cursor:pointer}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - var(--topH))}
nav#nav{position:sticky;top:var(--topH);height:calc(100vh - var(--topH));overflow:auto;border-right:1px solid var(--line);padding:14px 10px calc(var(--playerH) + 20px);background:var(--paper)}
.navsec{font-size:12px;color:var(--muted);margin:14px 10px 6px;letter-spacing:.04em}
.navi{display:block;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:8px 10px;cursor:pointer;margin-bottom:2px}
.navi:hover{background:var(--card2)}
.navi.on{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.navi .nt{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14px}
.navi .ns{font-size:12px;color:var(--muted)}
.bars{display:flex;gap:6px;margin-top:5px}
.bar{flex:1;height:5px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.bar.qb i{background:var(--ok)}
.star{color:var(--star)}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-weight:700;letter-spacing:.02em}
main#main{min-width:0;padding:22px 26px calc(var(--playerH) + 50px)}
h1{font-size:24px;margin:0 0 4px;line-height:1.3}
h2{font-size:18px;margin:26px 0 10px}
h3{font-size:16px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px}
.note{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:14px;background:var(--accent-soft)}
.note.warn{background:var(--warn-soft)}
.note.star{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--star) 40%,transparent)}
.note b{font-weight:700}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 13px;cursor:pointer;font-size:14px;transition:background .15s}
.btn:hover{background:var(--card2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* home */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:8px}
.big{font-size:30px;font-weight:700;line-height:1.1}
.stat .bar{height:8px;margin:6px 0 2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.ucard{cursor:pointer;transition:transform .12s, box-shadow .12s;display:flex;flex-direction:column;gap:4px}
.ucard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
.ucard .meta{font-size:12px;color:var(--muted)}
.steps{margin:6px 0 0;padding-left:20px}
.steps li{margin:3px 0}
.wrong{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px dashed var(--line);cursor:pointer}
.wrong:first-child{border-top:0}
.wrong .u{font-size:12px;color:var(--muted);white-space:nowrap;min-width:110px}
/* unit */
.uhead{margin-bottom:6px}
.mtabs{display:none;gap:6px;margin:10px 0}
.mtabs .btn{flex:1}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:20px;align-items:start;margin-top:12px}
.cols.single{grid-template-columns:minmax(0,1fr)}
.tcol{position:sticky;top:calc(var(--topH) + 12px);max-height:calc(100vh - var(--topH) - var(--playerH) - 26px);display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cols.single .tcol{position:static;max-height:none}
.tbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--card2)}
.tbar .tt{font-weight:700;margin-right:auto}
.tscroll{position:relative;overflow:auto;padding:6px 16px 60px;scroll-behavior:smooth;flex:1;min-height:0}
.cols.single .tscroll{overflow:visible}
.seg{border-bottom:1px solid var(--line);padding:12px 0 10px}
.seg:last-child{border-bottom:0}
.seghead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.segt{font-weight:700;font-size:14px;margin-right:auto}
.readbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer}
.readbtn.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.seg.read .segt::before{content:"✓ ";color:var(--ok)}
.turn{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;padding:5px 0}
.spk{font-size:12px;font-weight:700;padding-top:4px;color:var(--muted);overflow-wrap:anywhere}
.spk.man{color:var(--man)}.spk.woman{color:var(--woman)}
.spk.c1{color:#2f8f87}.spk.c2{color:#8a5ad6}.spk.c3{color:#c4661f}.spk.c4{color:#3b7f2e}.spk.c5{color:#b23a6f}.spk.c6{color:#4a67b6}
.en{font-family:var(--serif);font-size:17px;line-height:1.72;margin:0}
.narr .en{font-family:var(--sans);font-size:13.5px;color:var(--narr);font-style:italic}
.zh{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.6}
.hidezh .zh{display:none}
.s{cursor:pointer;border-radius:4px;transition:background .15s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.s:hover{background:color-mix(in srgb,var(--hl) 45%,transparent)}
.s.cur{background:var(--hl);box-shadow:0 0 0 2px var(--hl)}
.s.flash{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent)}100%{background:transparent;box-shadow:none}}
.evt{display:none;font-family:var(--sans);font-size:10.5px;font-weight:700;color:#fff;background:var(--accent);border-radius:5px;padding:0 4px;margin-right:4px;vertical-align:2px;font-style:normal}
.evt.show{display:inline-block;cursor:pointer}
.blind .en,.blind .zh{filter:blur(6px);user-select:none}
.blind .turn:hover .en,.blind .turn:hover .zh{filter:blur(6px)}
/* questions */
.part{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;margin-bottom:14px}
.part.hot{border:2px solid var(--star)}
.inst{font-size:13.5px;color:var(--muted);margin:2px 0 12px}
.parthead{display:flex;align-items:flex-start;gap:8px}
.parthead h3{flex:1}
.q{display:grid;grid-template-columns:28px minmax(0,1fr);gap:4px;padding:10px 0;border-top:1px dashed var(--line)}
.inst + .q{border-top:0}
.qn{font-weight:700;padding-top:1px}
.qq{font-weight:500;margin-bottom:6px}
.opts{display:grid;gap:6px}
.opt{display:flex;gap:8px;text-align:left;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;cursor:pointer;transition:background .12s,border-color .12s}
.opt:hover{background:var(--card2)}
.opt .ol{font-weight:700;color:var(--muted);min-width:26px}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .ol{color:var(--ok)}
.opt.wrongpick{background:var(--bad-soft);border-color:var(--bad)}
.opt.wrongpick .ol{color:var(--bad)}
.exp{margin-top:8px;border-radius:10px;padding:9px 12px;font-size:14px;background:var(--ok-soft)}
.exp.bad{background:var(--bad-soft)}
.exp .v{font-weight:700;margin-right:4px}
.exp.ok .v{color:var(--ok)}.exp.bad .v{color:var(--bad)}
.evb{display:inline-flex;gap:4px;align-items:center;border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);background:var(--card);color:var(--accent);border-radius:8px;padding:2px 8px;margin:6px 6px 0 0;font-size:12.5px;cursor:pointer;text-align:left}
.evb:hover{background:var(--accent-soft)}
.inp{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-bottom:2px solid var(--muted);border-radius:6px;padding:3px 7px;min-width:70px;max-width:100%}
.inp:focus{outline:2px solid var(--accent);outline-offset:1px}
.inp.ok{border-color:var(--ok);background:var(--ok-soft)}
.inp.bad{border-color:var(--bad);background:var(--bad-soft)}
.fixans{font-size:13px;font-weight:700;color:var(--ok);margin-left:4px}
.bn{font-weight:700;color:var(--muted);font-size:13px;margin-right:3px}
.notes .ln{padding:6px 0;line-height:2}
.notes .h{font-weight:700;margin-top:10px;font-size:15px}
.notes .h.first{margin-top:0;text-align:center;font-family:var(--serif);font-size:18px}
.notes .ex{border-bottom:1px solid var(--muted);padding:0 10px;font-style:italic}
.lnexp{font-size:13.5px;border-radius:8px;padding:6px 10px;margin:2px 0 4px;background:var(--ok-soft)}
.lnexp.bad{background:var(--bad-soft)}
.lnexp.warn{background:var(--warn-soft)}
table.tb{border-collapse:collapse;width:100%;font-size:14px}
.tb th,.tb td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.tb th{background:var(--card2)}
.tb .inp{width:100%;min-width:60px}
.tbwrap{overflow-x:auto}
.cloze{font-family:var(--serif);font-size:16.5px;line-height:2.3}
.cloze .inp{width:140px;font-family:var(--sans);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.score{font-weight:700}
.orderrow{display:flex;align-items:center;gap:10px;padding:5px 0;border-top:1px dashed var(--line)}
.orderrow:first-child{border-top:0}
select.inp{min-width:64px;padding:4px 6px}
.match .mrow{display:grid;grid-template-columns:30px 120px minmax(0,1fr);gap:10px;align-items:start;padding:7px 0;border-top:1px dashed var(--line)}
.match .mrow:first-child{border-top:0}
.match .w{font-family:var(--serif);font-size:16px}
.match .wz{font-size:12.5px;color:var(--muted)}
.bank{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:2px 12px;font-size:13.5px;background:var(--card2);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.bank b{display:inline-block;width:18px}
.bank .z{color:var(--muted);font-size:12px;margin-left:4px}
.zhblur .zhb{filter:blur(5px);user-select:none;-webkit-user-select:none;cursor:pointer;transition:filter .2s}
.zhblur .zhb.peek{filter:none}
.seating{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto auto;gap:8px;border:1.5px solid var(--ink);border-radius:6px;padding:10px;max-width:380px;margin:4px 0 10px;font-size:12.5px;line-height:1.35;background:var(--card)}
.seating div{border:1px solid var(--muted);border-radius:4px;padding:6px}
.seating .t3{grid-column:3;grid-row:1 / span 2;display:flex;align-items:center}
.tip{font-size:14px}
.tip table{border-collapse:collapse;width:100%;margin:6px 0}
.tip td,.tip th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.tip th{background:var(--card2)}
/* errfix */
.ef-modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.ef-text{font-family:var(--serif);font-size:18px;line-height:2.4;background:var(--card2);border-radius:12px;padding:12px 16px}
.ef-text .who{font-family:var(--sans);font-weight:700;font-size:14px;margin-right:6px}
.w{cursor:pointer;border-radius:4px;padding:1px 1px;transition:background .12s}
.w:hover{background:color-mix(in srgb,var(--bad) 14%,transparent)}
.w.sel{color:var(--bad);text-decoration:line-through;text-decoration-thickness:2px;background:var(--bad-soft)}
.fix{font-family:var(--sans);font-size:14px;width:110px;margin:0 4px;border-color:var(--bad)}
.w.miss{outline:2px dashed var(--warn);outline-offset:1px}
.w.good{color:var(--ok);background:var(--ok-soft)}
.w.fp{background:var(--warn-soft);color:var(--warn);text-decoration:line-through}
del.red{color:var(--bad);text-decoration-thickness:2px}
ins.red{color:var(--ok);text-decoration:none;font-weight:600;background:var(--ok-soft);border-radius:4px;padding:0 3px}
.ef-blank{display:inline-flex;align-items:baseline;gap:4px}
.ef-blank del{color:var(--muted);font-size:15px}
.eftable{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
.eftable td,.eftable th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.eftable th{background:var(--card2)}
.okc{color:var(--ok);font-weight:700}.badc{color:var(--bad);font-weight:700}.warnc{color:var(--warn);font-weight:700}
.vocab{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.vocab span{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:13.5px}
.vocab span b{font-family:var(--serif);font-weight:600;margin-right:5px}
/* player */
.player{position:fixed;left:0;right:0;bottom:0;z-index:50;height:var(--playerH);display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--card);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.06)}
.player.off{display:none}
.pbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card2);cursor:pointer;display:grid;place-items:center;font-size:15px;flex:none}
.pbtn.main{width:46px;height:46px;background:var(--accent);border-color:var(--accent);color:#fff;font-size:18px}
.pinfo{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.pname{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow{display:flex;align-items:center;gap:8px}
.ptime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{flex:1;accent-color:var(--accent);min-width:60px}
.spd{border:1px solid var(--line);background:var(--card2);border-radius:8px;padding:5px 8px;cursor:pointer;font-size:13px;font-variant-numeric:tabular-nums;flex:none}
.toast{position:fixed;left:50%;bottom:calc(var(--playerH) + 14px);transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:10px;font-size:13.5px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:.95}
.scrim{display:none}
@media (max-width:1150px){
  .cols{grid-template-columns:minmax(0,1fr)}
  .tcol{position:static;max-height:none}
  .tscroll{overflow:visible}
  .unit.tabbed .mtabs{display:flex}
  .unit.tabbed.show-q .tcol{display:none}
  .unit.tabbed.show-t .qcol{display:none}
}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav#nav{position:fixed;left:0;top:var(--topH);bottom:0;width:290px;max-width:85vw;z-index:45;transform:translateX(-102%);transition:transform .2s;background:var(--paper);box-shadow:6px 0 24px rgba(0,0,0,.12)}
  body.navopen nav#nav{transform:none}
  body.navopen .scrim{display:block;position:fixed;inset:var(--topH) 0 0 0;background:rgba(0,0,0,.25);z-index:44}
  .menu-btn{display:inline-block}
  main#main{padding:16px 14px calc(var(--playerH) + 50px)}
  .hero{grid-template-columns:1fr}
  .brand span{display:none}
  .turn{grid-template-columns:64px minmax(0,1fr)}
  .en{font-size:16.5px}
  .pbtn.sk{display:none}
  .sync{display:none}
  .match .mrow{grid-template-columns:26px 1fr}
  .match .mrow .w{grid-column:2}
  .match .mrow select{grid-column:2}
}
</style>
</head>
<body>
<header class="top">
  <button class="menu-btn" id="menuBtn" aria-label="單元選單">☰ 單元</button>
  <div class="brand" id="brand"><b>期中聽力練習器</b><span>基礎專業英語｜講義音檔 × 逐字稿 × 題目</span></div>
  <div class="sp"></div>
  <span class="sync" id="sync">進度存在這個瀏覽器</span>
</header>
<div class="layout">
  <nav id="nav" aria-label="單元"></nav>
  <div class="scrim" id="scrim"></div>
  <main id="main"></main>
</div>
<div class="player off" id="player">
  <button class="pbtn sk" id="pBack" title="倒退 3 秒 (←)">↺3</button>
  <button class="pbtn main" id="pPlay" title="播放／暫停 (空白鍵)">▶</button>
  <button class="pbtn sk" id="pFwd" title="快轉 3 秒 (→)">3↻</button>
  <button class="pbtn" id="pLine" title="重播目前這一句" style="font-size:12px;white-space:nowrap">本句</button>
  <div class="pinfo">
    <div class="pname" id="pName"></div>
    <div class="prow"><span class="ptime" id="pCur">0:00</span><input type="range" id="pSeek" min="0" max="100" step="0.1" value="0" aria-label="播放進度"><span class="ptime" id="pDur">0:00</span></div>
  </div>
  <button class="spd" id="pSpd" title="播放速度">1.0×</button>
</div>

ats too late.","He didn't know if this was a good restaurant.","He thought he might be late for a party."],"ans":0,"exp":"男生一開始就說 \"We don't have any reservations\"，最後說 \"I was worried\"——擔心是因為沒訂位。","ev":["We don't have any reservations","I was worried"]}]},{"title":"Q4–6","inst":"Questions 4 through 6 refer to the following conversation.","items":[{"type":"mc","n":"4","q":"What is the problem?","lab":"ABCD","opts":["The new shipment has not arrived.","The wrong order was delivered.","The company sent too many packages.","The invoice number was incorrect."],"ans":1,"exp":"\"There were twenty packages of blue paper, but we ordered white paper.\" 送錯貨 → (B)。","ev":["There were twenty packages of blue paper"]},{"type":"mc","n":"5","q":"What can be inferred from this conversation?","lab":"ABCD","opts":["The problem has already been taken care of.","There is no blue paper in stock at present.","Ms. Tupton's manager wasn't upset last time.","Janice Nelson is a new employee."],"ans":2,"exp":"推論題：\"…we spoke last week about a similar situation, and this time my manager's upset.\" 「這次」經理生氣了 → 上次沒有生氣 (C)。","ev":["and this time my manager's upset"]},{"type":"mc","n":"6","q":"What is Ms. Nelson planning to do?","lab":"ABCD","opts":["Make a copy of the invoice","Speak to her manager","Call Ms. Tupton later today","Send a new order"],"ans":3,"exp":"Janice Nelson 說 \"I'll get an order of white paper out to you later this afternoon\" → 寄出新的一批貨 (D)。(A) invoice 是她要對方提供發票號碼，不是影印發票。","ev":["I'll get an order of white paper out to you"]}]},{"title":"Q7–9","inst":"Questions 7 through 9 refer to the following conversation.","items":[{"type":"mc","n":"7","q":"What are the speakers mainly discussing?","lab":"ABCD","opts":["Shopping for clothes","An important meeting","Dry cleaning some clothing","Scheduling a dinner meeting"],"ans":2,"exp":"整段都在講把洋裝送洗燙好（cleaned and pressed）、幾點能送回來 → (C)。dinner meeting 只是送洗的原因。","ev":["have our dresses cleaned and pressed"]},{"type":"mc","n":"8","q":"What does Ruby say about the extra fee?","lab":"ABCD","opts":["It's too expensive.","It isn't necessary.","She doesn't mind paying it.","She will pay it with a credit card."],"ans":2,"exp":"聽到要加收費用後，Ruby 說 \"Well, I guess it's all right. We want to look our best tonight.\" → 不介意付 (C)。","ev":["Well, I guess it's all right"]},{"type":"mc","n":"9","q":"Where most likely does the man work?","lab":"ABCD","opts":["A restaurant","A hotel","A newspaper","A dry cleaning shop"],"ans":1,"exp":"線索：\"We're staying in room 328\"、\"Our laundry service… to your room\"、\"the front desk\" → 飯店 (B)。","ev":["We're staying in room 328","come back to the front desk"]}]},{"title":"Q10–12","inst":"Questions 10 through 12 refer to the following conversation.","items":[{"type":"mc","n":"10","q":"What does the man mean when he says, \"Not as much as I thought I would\"?","lab":"ABCD","opts":["He paid less money than he expected.","He enjoys his job less than he predicted.","He spent less time at work than he anticipated.","He gets less salary than he thought."],"ans":1,"exp":"這句是回答 \"So, are you enjoying the job?\" → 沒有想像中那麼喜歡這份工作 (B)。","ev":["So, are you enjoying the job?","Not as much as I thought I would"]},{"type":"mc","n":"11","q":"What does the man think about his job?","lab":"ABCD","opts":["It isn't challenging enough for him.","He doesn't like the long hours.","He wants to quit immediately.","It doesn't provide any options."],"ans":1,"exp":"\"I didn't think I'd have to work so late to meet the deadlines.\" → 不喜歡工時長 (B)。他說自己 \"I'm not a quitter\"，所以 (C) 錯；他喜歡挑戰，(A) 也錯。","ev":["I didn't think I'd have to work so late"]},{"type":"mc","n":"12","q":"What advice does the woman give?","lab":"ABCD","opts":["To stay on the job","To take a risk","To apply for another position","To give someone a present"],"ans":0,"exp":"\"Well, give it a chance. You've only been in this position for a month.\" → 再給這份工作一點時間、繼續做下去 (A)。注意 give 不是送禮物 (D)。","ev":["Well, give it a chance"]}]}],"tip":true},"ex33":{"parts":[{"title":"Exercise 3.3","inst":"Focus: Answering overview questions about locations and occupations. 聽完對話，選出最適合的答案。","items":[{"type":"mc","n":"1","q":"Who is the second speaker?","lab":"ABCD","opts":["An electrician","A banker","An engineer","A jeweler"],"ans":0,"exp":"開關壞了，第二個人說整棟建築要重新配線（rewiring）→ 電工 (A)。","ev":["This whole building needs rewiring"]},{"type":"mc","n":"2","q":"Where are they?","lab":"ABCD","opts":["In a grocery store","On a farm","At an outdoor market","In a vegetable garden"],"ans":2,"exp":"\"The farmers' fruits and vegetables…\"、\"nice to be outside\" → 在戶外買農夫的蔬果 = 露天市集 (C)。","ev":["The farmers' fruits and vegetables","it's nice to be outside"]},{"type":"mc","n":"3","q":"Where is this conversation taking place?","lab":"ABCD","opts":["At a men's clothing store","In a courtroom","At an art gallery","In a paint store"],"ans":0,"exp":"suit（西裝）、jacket、taken in（改小）→ 男裝店 (A)。這裡 suit 不是「訴訟」，color 也不是油漆。","ev":["I think that suit looks very nice on you","You can have that taken in a little"]},{"type":"mc","n":"4","q":"Who are they?","lab":"ABCD","opts":["Printers","Architects","Fashion designers","House painters"],"ans":1,"exp":"blueprints（藍圖）、design of the foyer（門廳設計）、builder（營造商）→ 建築師 (B)。","ev":["do you have those blueprints ready yet","changing the design of the foyer"]},{"type":"mc","n":"5","q":"Who is Thomas?","lab":"ABCD","opts":["A sailor","A mechanic","A plumber","A carpenter"],"ans":3,"exp":"Thomas 修木樓梯（wooden stairway）、會蓋木平台（deck）、在做建築工程 → 木匠 (D)。deck 也有「甲板」的意思，所以 (A) sailor 是陷阱。","ev":["He did a great job repairing the wooden stairway"]},{"type":"mc","n":"6","q":"Where are they?","lab":"ABCD","opts":["At a coffee shop","On an airplane","In an automobile","In a clothing store"],"ans":1,"exp":"\"We're on our final approach now\"（飛機最後進場降落）、\"fasten my seat belt\" → 飛機上 (B)。coffee 是陷阱。","ev":["We're on our final approach now"]},{"type":"mc","n":"7","q":"Who is the man?","lab":"ABCD","opts":["A police officer","A gardener","A security guard","A pilot"],"ans":2,"exp":"男生說沒有識別證（identification badge）不能進入工廠（plant）那一區，還要幫她申請訪客證 → 警衛 (C)。plant 是「工廠」不是植物，(B) 是陷阱。","ev":["no one is allowed in that wing of the plant","He can arrange a visitor's badge for you"]},{"type":"mc","n":"8","q":"Where is this conversation taking place?","lab":"ABCD","opts":["On a bus","In a taxi","At the library","On Clifton Avenue"],"ans":0,"exp":"\"Isn't this your usual stop?\"、\"get off at the next stop\" → 在公車上 (A)。library 和 Clifton Avenue 是她要去的地方。","ev":["Isn't this your usual stop?","get off at the next stop"]},{"type":"mc","n":"9","q":"Where are the speakers?","lab":"ABCD","opts":["At a cinema","At a television studio","At a bookstore","At a video rental store"],"ans":3,"exp":"\"I can't decide what to rent\"、\"What shelf is it on?\" → 租片店 (D)。電影院不用「租」也沒有架子。","ev":["I can't decide what to rent","What shelf is it on?"]},{"type":"mc","n":"10","q":"Who is Lisa?","lab":"ABCD","opts":["An interior designer","The director","A painter","A newspaper reporter"],"ans":0,"exp":"Lisa 決定辦公室不油漆、改貼壁紙，\"that's the kind of decision we hired her to make\" → 室內設計師 (A)。director 是辦公室主人，不是 Lisa。","ev":["Lisa decided not to have it painted","the kind of decision we hired her to make"]},{"type":"mc","n":"11","q":"Where are they?","lab":"ABCD","opts":["In a hardware store","In a dentist's office","In an artist's studio","In an electronics store"],"ans":0,"exp":"saws（鋸子）、electric drills（電鑽）→ 五金行 (A)。drill 在 3.2 也出現在牙醫，但這裡是電鑽。","ev":["Can you show me your saws?","your electric drills"]},{"type":"mc","n":"12","q":"Who is the first speaker?","lab":"ABCD","opts":["A teacher","A mechanic","A doctor","A pharmacist"],"ans":2,"exp":"做檢查（tests）、血壓（blood pressure）、開藥（prescribing medicine）→ 醫生 (C)。藥劑師只配藥，不開處方。","ev":["Your blood pressure is higher","I'm going to be prescribing some medicine"]}]}]},"ex35":{"parts":[{"title":"Exercise 3.5","inst":"Focus: Answering detail questions dealing with time and reasons.","items":[{"type":"mc","n":"1","q":"Why is Mr. Maras leaving?","lab":"ABCD","opts":["To talk to a client","To go to his office","To board an airplane","To meet his wife"],"ans":3,"exp":"\"I'm going to pick up my wife at the airport.\" → 去接太太 (D)。airport 和 clients 都是陷阱。","ev":["I'm going to pick up my wife at the airport"]},{"type":"mc","n":"2","q":"When will the office open again?","lab":"ABCD","opts":["This weekend","On Monday","On Tuesday","On Wednesday"],"ans":2,"exp":"週末不開，\"Monday is a holiday\" 星期一也不開 → 星期二才開 (C)。答案沒有直接說出來。","ev":["closed for the weekend","Monday is a holiday"]},{"type":"mc","n":"3","q":"At what time will the man see the movie?","lab":"ABCD","opts":["At 7:30","At 7:40","At 9:00","At 9:10"],"ans":2,"exp":"7:30 那場已開演十分鐘（7:40 是陷阱），他說 \"I'll come back for the nine o'clock showing\" → (C)。","ev":["Has the 7:30 showing","the nine o'clock showing"]},{"type":"mc","n":"4","q":"Why does Carlos congratulate Eva?","lab":"ABCD","opts":["She'll be making a lot more money.","She found a better job.","She's been promoted.","She likes the region where she'll be working."],"ans":3,"exp":"\"Congratulations! I know you like that part of the country.\" → 她喜歡要去工作的地區 (D)。她只是被調區（assigned），沒說升官或加薪。","ev":["I know you like that part of the country"]},{"type":"mc","n":"5","q":"When did Frank start working here?","lab":"ABCD","opts":["In 2003","In 2004","In 2005","In 2006"],"ans":1,"exp":"Joe 是 2005 年來的；被問「你是隔年（2006）嗎？」Frank 說 \"No, the year before.\" → 前一年 2004 (B)。2005、2006 都是對話裡出現的陷阱數字。","ev":["started working here in 2005","No, the year before"]},{"type":"mc","n":"6","q":"When does Patrick hope to come to work?","lab":"ABCD","opts":["At lunchtime","This afternoon","Tomorrow morning","Tomorrow afternoon"],"ans":1,"exp":"\"if I feel better, I'm going to come in sometime after lunch.\" 午餐「之後」= 今天下午 (B)。tomorrow morning 是對方問的時間，不是他的回答。","ev":["come in sometime after lunch"]},{"type":"mc","n":"7","q":"Why did the man NOT take the shuttle bus?","lab":"ABCD","opts":["He wanted to save time.","He wanted to impress someone.","It left without him.","There was no room on it."],"ans":0,"exp":"\"there just wasn't enough time to wait for the shuttle bus. I would have missed my flight.\" 沒時間等 → 為了省時間才搭禮車 (A)。","ev":["there just wasn't enough time to wait for the shuttle bus"]},{"type":"mc","n":"8","q":"Why is Dan upset?","lab":"ABCD","opts":["He lost his new coffee mug.","He could not attend the conference.","He did not get any coffee this morning.","He could not find some important papers."],"ans":0,"exp":"\"He can't find his new coffee mug.\" → (A)。conference room 只是杯子被看到的地點，(B) 是陷阱。","ev":["He can't find his new coffee mug"]},{"type":"mc","n":"9","q":"How long was Ms. Shearson out of the country?","lab":"ABCD","opts":["For a few days","For a month","Exactly a year","Just over a year"],"ans":3,"exp":"\"It was a year last month.\" 上個月就滿一年了，到現在已經超過一年 → (D)。不是剛好一年 (C)。","ev":["It was a year last month"]},{"type":"mc","n":"10","q":"Why is Jim NOT going to the trade fair?","lab":"ABCD","opts":["The distribution manager will not permit it.","He is too busy.","The trip is too expensive.","He does not want to attend."],"ans":1,"exp":"\"I wish I could. I just have too many things to do here.\" → 太忙 (B)。他想去（I wish I could），所以 (D) 錯；物流經理只是「會去」，沒有不准他去。","ev":["I just have too many things to do here"]}]}]},"ex38":{"parts":[{"title":"Exercise 3.8","inst":"Focus: Answering inference questions. 推論題：答案通常不會直接說出來。","items":[{"type":"mc","n":"1","q":"What can be inferred about their situation?","lab":"ABCD","opts":["They are having dinner by candlelight.","The electricity is not on.","They are examining something with a flashlight.","It is the middle of the day."],"ans":1,"exp":"\"I never think of buying batteries until the electricity goes out\" + \"we'll just have to use candles then\" → 現在停電了 (B)。candles、flashlight 都是對話裡的字，但 (A)(C) 不是推論結果。","ev":["until the electricity goes out","use candles then"]},{"type":"mc","n":"2","q":"What can be said about the situation?","lab":"ABCD","opts":["They are not at home.","The sky is seldom clear here.","The smell is unpleasant.","They have just walked for miles."],"ans":0,"exp":"\"The sky is never this clear at home. You can see for miles out here\" → 現在人不在家 (A)。是「家裡」的天空很少這麼清澈，不是「這裡」(B)；see for miles 是看得很遠，不是走了好幾英里 (D)。","ev":["The sky is never this clear at home","You can see for miles out here"]},{"type":"mc","n":"3","q":"What does the woman imply?","lab":"ABCD","opts":["She cannot go sailing tomorrow.","Her decision depends on the weather.","There will not be enough wind for sailing.","She enjoys this kind of weather."],"ans":1,"exp":"被邀去航海，女生說 \"Perhaps. Do you know what the weather's going to be like?\" → 去不去要看天氣 (B)。","ev":["Perhaps.","Do you know what the weather's going to be like?"]},{"type":"mc","n":"4","q":"What is probably true about Natalie?","lab":"ABCD","opts":["She makes her own clothing at home.","She does not need any new clothes.","She has worked there only for a few weeks.","She no longer works as a clerk."],"ans":2,"exp":"做滿一個月才有折扣，她說 \"I'll wait a couple of weeks\" → 她才做了幾個禮拜，還沒滿一個月 (C)。","ev":["once they've worked here for a month","I'll wait a couple of weeks"]},{"type":"mc","n":"5","q":"What is the man implying?","lab":"ABCD","opts":["He just started playing the piano.","He would like to take lessons from the woman.","He has never taken lessons.","He does not play as well as the woman."],"ans":3,"exp":"說話者 A 是男生：\"So did I, but I sure can't play like you.\" 我也學過，但彈得沒你好 → (D)。他說 So did I，所以 (C) 錯。","ev":["So did I, but I sure can't play like you"]},{"type":"mc","n":"6","q":"What is known about the security system?","lab":"ABCD","opts":["It is generally on in the morning.","It is an unusual system.","It was broken when the man arrived.","It was recently installed."],"ans":0,"exp":"保全系統早上被關掉，兩人都覺得 \"strange\" → 平常早上應該是開著的 (A)。turned off 不等於 broken。","ev":["the security system had been turned off","That's strange"]},{"type":"mc","n":"7","q":"What can be inferred about the climate where they live now?","lab":"ABCD","opts":["It has four seasons.","It is always warm.","It is usually cool and brisk.","It is nicest in the autumn."],"ans":1,"exp":"\"another warm day\"、\"Of course\"、懷念有四季的地方 → 現在住的地方一直都很溫暖 (B)。","ev":["It's going to be another warm day","I miss living somewhere that has four seasons"]},{"type":"mc","n":"8","q":"What can be inferred about these two?","lab":"ABCD","opts":["They do not have to work today.","They have to attend a meeting.","They wrote the memo.","They are not new employees."],"ans":3,"exp":"會議 \"That's only for new employees\"，對方說 \"you're right\" → 他們不用去，表示他們不是新人 (D)。","ev":["That's only for new employees"]}]}],"tip":true},"vocab":{"parts":[{"title":"Exercise 3.1 — 地點 Locations","inst":"Match the locations with the appropriate group of vocabulary words.（沒有音檔）","items":[{"type":"match","bank":[["a","airport","機場"],["b","apartment complex","公寓社區"],["c","bakery","麵包店"],["d","bank","銀行"],["e","beach","海灘"],["f","computer store","電腦店"],["g","construction site","工地"],["h","courtroom","法庭"],["i","farm","農場"],["j","football stadium","足球場"],["k","freeway","高速公路"],["l","grocery store","雜貨店"],["m","hair salon","美髮店"],["n","hardware store","五金行"],["o","hotel","飯店"],["p","jewelry store","珠寶店"],["q","laundromat","自助洗衣店"],["r","post office","郵局"],["s","restaurant","餐廳"],["t","stationery store","文具店"],["u","theater","劇院"],["v","travel agency","旅行社"]],"rows":[{"n":"1","w":"rolls / cake / bread","zh":"小圓麵包／蛋糕／麵包","ans":"c"},{"n":"2","w":"stage / cast / box office","zh":"舞台／演員陣容／售票處","ans":"u"},{"n":"3","w":"bulldozer / hard hat / crane","zh":"推土機／安全帽／起重機","ans":"g"},{"n":"4","w":"chain / ring / bracelet","zh":"鍊子／戒指／手鐲","ans":"p"},{"n":"5","w":"menu / terminal / keyboard","zh":"選單／終端機／鍵盤","ans":"f"},{"n":"6","w":"dryer / hangers / detergent","zh":"烘衣機／衣架／洗衣精","ans":"q"},{"n":"7","w":"terminal / concourse / gate","zh":"航廈／大廳／登機門","ans":"a"},{"n":"8","w":"surf / towel / umbrella","zh":"浪花／毛巾／陽傘","ans":"e"},{"n":"9","w":"pens / envelopes / letterhead","zh":"筆／信封／印有抬頭的信紙","ans":"t"},{ "ans":["automatically"],"show":"automatically","pos":"adv.","zh":"自動地","ev":["software that automatically drives a car"]}," drives a car, or studies x-ray images, AI software has opened the door for computers to automate tasks for the world's largest, multi-trillion dollars of industries.\n",{"b":"3","ans":["healthcare","health care","health-care"],"show":"Healthcare","pos":"n.","zh":"醫療保健","ev":["healthcare, financial services"]},", financial services, ",{"b":"4","ans":["transportation"],"show":"transportation","pos":"n.","zh":"交通運輸","ev":["transportation, and manufacturing"]},", and manufacturing. AI has opened immense opportunities.\n",{"b":"5","ans":["agile"],"show":"Agile","pos":"adj.","zh":"靈活的、敏捷的","ev":["Agile companies will take advantage of AI"]}," companies will take advantage of AI, and boost their position. Companies less so, will ",{"b":"6","ans":["perish"],"show":"perish","pos":"v.","zh":"滅亡；被淘汰","ev":["Companies less so will perish"]},". ",{"b":"7","ans":["entrepreneurs"],"show":"Entrepreneurs","pos":"n.","zh":"創業家（複數）","ev":["Entrepreneurs, many of them here today"],"warn":{"entrepreneur":"原音是複數 entrepreneurs（後面接 many of them）。"}},", many of them here today, will start new companies.\nAnd like in every computing era before, create new industries. AI will create new jobs that didn't exist before. Like data engineering, prompt engineering, AI factory ",{"b":"8","ans":["operations"],"show":"operations","pos":"n.","zh":"營運、運作（複數）","ev":["AI factory operations"],"warn":{"operation":"原音是複數 operations。"}},", and AI safety engineers.\nThese are jobs that never existed before. Automated tasks will ",{"b":"9","ans":["obsolete"],"show":"obsolete","pos":"v.","zh":"使…過時、淘汰（obsolete 通常是形容詞「過時的」，這裡當動詞用）","ev":["Automated tasks will obsolete some jobs"]}," some jobs. And for sure, AI will change every job. Supercharging the performance of programmers, designers, artists, marketers, and manufacturing planners.\nJust as every ",{"b":"10","ans":["generation"],"show":"generation","pos":"n.","zh":"世代","ev":["Just as every generation before you"]}," before you embraced technologies to succeed, every company, and you, must learn to take advantage of AI. And do amazing things with an AI co-pilot by your side.\nAI has reinvented computing from the ground up. In every way, this is a rebirth of the computer industry. And a golden opportunity for the companies of Taiwan.\nYou are the foundation and bedrock of the computer industry. Within the next decade, our industry will replace over a trillion dollars of the world's traditional computers with new, accelerated AI computers."]}]}]},"trump":{"parts":[{"title":"考卷填空：2024 勝選演說","inst":"依照考卷內容填空（共 12 格）。檢查後會附上每格的詞性和中文意思。","items":[{"type":"cloze","parts":["1. Thank you very much. Wow. Well, I want to thank you all very much. This is ",{"b":"1","ans":["great"],"show":"great","pos":"adj.","zh":"很棒的","ev":["This is great."]},".\n","2. These are our ",{"b":"2-1","ans":["friends"],"show":"friends","pos":"n.","zh":"朋友（複數）","ev":["These are our friends."]},". We have thousands of friends in this ",{"b":"2-2","ans":["incredible"],"show":"incredible","pos":"adj.","zh":"不可思議的、驚人的","ev":["in this incredible movement"]}," movement.\n","3. This was a movement like nobody's ever seen before, and frankly, this was, I believe, the greatest ",{"b":"3","ans":["political"],"show":"political","pos":"adj.","zh":"政治的","ev":["the greatest political movement of all time"]}," movement of all time.\n","4. There's never been anything like this in this country, and maybe beyond. And now it's going to reach a new level of ",{"b":"4","ans":["importance"],"show":"importance","pos":"n.","zh":"重要性","ev":["reach a new level of importance"]},".\n","5. And now it's going to reach a new level of importance, because we're going to help our country ",{"b":"5","ans":["heal"],"show":"heal","pos":"v.","zh":"療傷、癒合（help + 原形動詞）","ev":["because we're going to help our country heal"]},".\n","6. We have a country that needs help, and it needs help very ",{"b":"6","ans":["badly"],"show":"badly","pos":"adv.","zh":"非常、迫切地（need… badly 非常需要）","ev":["it needs help very badly"]},".\n","7. We're going to fix our ",{"b":"7","ans":["borders"],"show":"borders","pos":"n.","zh":"邊境、國界（複數）","ev":["We're going to fix our borders."],"warn":{"border":"原音是複數 borders。"}},", we're going to fix everything about our country.\n","8. We made ",{"b":"8-1","ans":["history"],"show":"history","pos":"n.","zh":"歷史（make history 創造歷史）","ev":["We made history for a reason tonight"]}," for a reason tonight, and the reason is going to be just ",{"b":"8-2","ans":["that"],"show":"that","pos":"pron.","zh":"那樣（just that 正是如此）","ev":["the reason is going to be just that"]},".\n","9. We overcame obstacles that nobody thought ",{"b":"9","ans":["possible"],"show":"possible","pos":"adj.","zh":"可能的（think something possible 認為某事可能）","ev":["obstacles that nobody thought possible"]},", and it is now clear that we've achieved the most incredible political thing.\n","10. Look what happened, is this ",{"b":"10","ans":["crazy"],"show":"crazy","pos":"adj.","zh":"瘋狂的","ev":["Is this crazy?"]},"? But it's a political victory that our country has never seen before."]}]}]},"ivanka":{"parts":[{"title":"考卷填空：Think Big Again","inst":"依照考卷內容填空。答案依原音整理，檢查後會附上每格的詞性和中文意思。","items":[{"type":"cloze","parts":["Good evening.\nThank you. One year ago, I introduced my father when he declared his ",{"b":"1","ans":["candidacy"],"show":"candidacy","pos":"n.","zh":"參選、候選資格（declare one's candidacy 宣布參選）","ev":["when he declared his candidacy"]},".\n","In his own way, and through his own sheer force of will, he sacrificed greatly to enter the political ",{"b":"2","ans":["arena"],"show":"arena","pos":"n.","zh":"舞台、競技場（political arena 政治舞台）","ev":["to enter the political arena as an outsider"]}," as an outsider.\n","And he prevailed against a field of ",{"b":"3","ans":["16","sixteen"],"show":"16 (sixteen)","pos":"num.","zh":"十六","ev":["a field of 16 very talented competitors"]}," very talented competitors.\n","For more than a year, Donald Trump has been the people's ",{"b":"4","ans":["champion"],"show":"champion","pos":"n.","zh":"捍衛者、擁護者（也有「冠軍」的意思）","ev":["has been the people's champion"]},", and tonight he's the people's ",{"b":"5","ans":["nominee"],"show":"nominee","pos":"n.","zh":"被提名人","ev":["he is the people's nominee"]},".\n","Like many of my fellow ",{"b":"6","ans":["millennials"],"show":"millennials","pos":"n.","zh":"千禧世代（複數）","ev":["Like many of my fellow millennials"],"warn":{"millennial":"fellow millennials 要用複數。","millenials":"拼字：millennials 有兩個 l、兩個 n。"}},", I do not consider myself categorically Republican or Democrat.\n","More than party affiliation, I vote based on what I believe is ",{"b":"7","ans":["right"],"show":"right","pos":"adj.","zh":"正確的","ev":["what I believe is right"]},", for my family and for my ",{"b":"8","ans":["country"],"show":"country","pos":"n.","zh":"國家","ev":["for my family and for my country"]},". Sometimes it's a tough choice. That is not the case this time.\n","As the proud daughter of your nominee, I am here to tell you that this is the ",{"b":"9","ans":["moment"],"show":"moment","pos":"n.","zh":"時刻（this is the moment 就是現在）","ev":["this is the moment"]}," and Donald Trump is the person to make America ",{"b":"10","ans":["great"],"show":"great","pos":"adj.","zh":"偉大的（make America great again）","ev":["to make America great again"]}," again."]}]}]}};</script>

function items(uid){ const q=Q[uid]; const out=[]; if(!q) return out; q.parts.forEach((p,pi)=>p.items.forEach((it,ii)=>out.push({it,key:uid+"."+pi+"."+ii,pi,ii}))); return out; }
function unitScore(uid){
  let tot=0,done=0,ok=0;
  items(uid).forEach(({it,key})=>{
    if(it.type==="mc"){ tot++; const a=S.ans[key]; if(a!=null){ done++; if(a===it.ans) ok++; } }
    else if(it.type==="order"){ tot+=it.rows.length; if(S.chk[key]){ done+=it.rows.length; it.rows.forEach((r,ri)=>{ if((S.ans[key+".r"+ri]||"")===r.ans) ok++; }); } }
    else if(it.type==="match"){ tot+=it.rows.length; if(S.chk[key]){ done+=it.rows.length; it.rows.forEach((r,ri)=>{ if((S.ans[key+".r"+ri]||"")===r.ans) ok++; }); } }
    else if(["table","cloze","notes"].includes(it.type)){ const bl=blanksOf(it); tot+=bl.length; if(S.chk[key]){ done+=bl.length; bl.forEach(b=>{ if(blankOk(b,S.ans[key+".b"+b.b])) ok++; }); } }
    else if(it.type==="errfix"){ tot+=7; if(S.chk["pfd.ef"]){ done+=7; ok+=efGrade(efState().sel).filter(g=>g.st==="ok").length; } }
  });
  return {tot,done,ok};
}
function readCount(uid){ const u=U[uid]; if(!u) return {n:0,t:0}; const r=S.read[uid]||{}; return {n:u.segs.filter((_,i)=>r[i]).length,t:u.segs.length}; }
function isAnswered(key,it){
  if(it.type==="mc") return S.ans[key]!=null;
  return !!S.chk[key];
}

/* ---------- evidence tags ---------- */
let EVMAP={}; // uid -> sentIdx -> [{label,key}]
function buildEv(){
  EVMAP={};
  Object.keys(Q).forEach(uid=>{
    const m=EVMAP[uid]={};
    items(uid).forEach(({it,key})=>{
      const add=(snips,label,k2)=>{ (snips||[]).forEach(s=>{ const i=findSent(uid,s); if(i>=0){ (m[i]=m[i]||[]).push({label,key:k2||key}); } }); };
      if(it.type==="mc"||it.type==="key") add(it.ev,"Q"+it.n);
      else if(it.type==="order") it.rows.forEach(r=>add(r.ev,"排序"));
      else if(it.type==="cloze"){ add(it.ev,"填空"); blanksOf(it).forEach(b=>add(b.ev,"("+b.b+")")); }
      else if(it.type==="table"||it.type==="notes") blanksOf(it).forEach(b=>add(b.ev,"("+b.b+")"));
    });
    if(uid==="pfd"){ ["At Camden, get off","Turn right, walk down","take bus 153","My office is opposite"].forEach(s=>{ const i=findSent("pfd",s); if(i>=0) (m[i]=m[i]||[]).push({label:"找錯",key:"pfd.ef"}); }); }
  });
}
function evShown(t){ if(t.key==="pfd.ef") return !!S.chk["pfd.ef"]; const [uid,pi,ii]=t.key.split("."); const it=Q[uid]&&Q[uid].parts[+pi]&&Q[uid].parts[+pi].items[+ii]; return it?isAnswered(t.key,it):false; }

function spkClass(s){ if(s==="N") return "narr"; if(/^Man/.test(s)) return "man"; if(/^Woman/.test(s)) return "woman"; let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))>>>0; return "c"+(1+h%6); }

const BLOB={}, FETCHING={};
function prefetch(uid){
  if(BLOB[uid]||FETCHING[uid]||typeof fetch!=="function") return;
  FETCHING[uid]=1;
  fetch("audio/"+uid+".mp3").then(r=>{ if(!r.ok) throw 0; return r.blob(); }).then(b=>{ BLOB[uid]=URL.createObjectURL(b); swapToBlob(); }).catch(()=>{}).finally(()=>{ FETCHING[uid]=0; });

function swapToBlob(){

function tick(force){

  else if(act==="effillcheck"){ S.chk["pfd.efill"]=true; save(); rerenderEf(); }
  else if(act==="effillreset"){ delete S.ans["pfd.efill"]; delete S.chk["pfd.efill"]; save(); rerenderEf(); }
  else if(act==="efplay"){ const a1=findSent("pfd","At Camden, get off"), a2=findSent("pfd","let me just check once more"); const u=U.pfd; if(cur!=="pfd") return; playFrom(u.flat[a1].t-0.15,u.flat[a2].t-0.05); if(narrow()) toast("播放中…可以切到「逐字稿」看原文"); }
  else if(act==="resetall"){ if(a.dataset.sure==="1"){ S={read:{},ans:{},chk:{},ts:Date.now()}; save(); route(true); toast("已清除全部進度"); } else { a.dataset.sure="1"; a.textContent="再按一次確認清除"; setTimeout(()=>{ if(a.isConnected){ a.dataset.sure=""; a.textContent="清除全部進度"; } },3000); } }
});
document.addEventListener("input",e=>{
  const a=e.target.closest("[data-act]"); if(!a) return;
  if(a.dataset.act==="blank"){ S.ans[a.dataset.key+".b"+a.dataset.b]=a.value; save(); }
  else if(a.dataset.act==="effix"){ efState().sel[a.dataset.sk]=a.value; save(); }
  else if(a.dataset.act==="effill"){ const f=S.ans["pfd.efill"]=S.ans["pfd.efill"]||{}; f["e"+a.dataset.e]=a.value; save(); }
});
document.addEventListener("change",e=>{ const a=e.target.closest("[data-act='sel']"); if(!a) return; S.ans[a.dataset.key+".r"+a.dataset.r]=a.value; save(); });
document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")||e.metaKey||e.ctrlKey||e.altKey) { if(e.key==="Enter"&&e.target.matches(".fix,[data-act='effill']")){ e.preventDefault(); } return; }
  if(!U[cur]) return;
  if(e.code==="Space"&&!e.target.closest("button")){ e.preventDefault(); $("#pPlay").click(); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); $("#pBack").click(); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); $("#pFwd").click(); }
});
["wheel","touchmove"].forEach(ev=>document.addEventListener(ev,e=>{ if(e.target.closest("#tscroll")||narrow()) userScrollAt=Date.now(); },{passive:true}));
$("#menuBtn").addEventListener("click",()=>document.body.classList.toggle("navopen"));
$("#scrim").addEventListener("click",()=>document.body.classList.remove("navopen"));
$("#brand").addEventListener("click",()=>go("home"));
window.addEventListener("hashchange",()=>route());
buildEv();
route();
})();
</script>
</body>
</html>
